  <main class="stage" id="stage">
    <svg id="map" role="img" aria-label="Map of Ukraine and surrounding region"></svg>

    <div class="loading" id="boot" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span id="boot-status">Loading map data</span>
    </div>

    <!-- Legend + layers (left) -->
    <section class="card card-legend collapsible" id="panel-legend" aria-label="Legend">
      <button class="card-hd" type="button" aria-expanded="true" data-collapse="panel-legend">
        <span>Legend</span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="card-bd">
        <div id="legend-body"></div>
        <div class="layers">
          <div class="sec-title">Layers</div>
          <div id="layer-toggles"></div>
        </div>
      </div>
    </section>


    <!-- Map instruments -->
    <div class="instruments">
      <div class="scalebar" id="scalebar" aria-hidden="true"></div>
    </div>
  </main>

  <!-- Timeline dock -->
  <section class="dock" id="dock" aria-label="Historical timeline">
    <div class="dock-left">
      <div class="tl-controls">
        <div class="tl-transport">
          <button type="button" class="ib" id="tl-prev" title="Previous era (Left arrow)" aria-label="Previous era"><svg viewBox="0 0 16 16"><path d="M4 3.5v9" /><path d="M12 3.8L6 8l6 4.2z" class="f"/></svg></button>
          <button type="button" class="ib ib-play" id="tl-play" title="Play (Space)" aria-label="Play"><svg viewBox="0 0 16 16"><path class="f ico-play" d="M5.5 3.5L12.5 8l-7 4.5z"/><path class="ico-pause" d="M6 4v8M10 4v8"/></svg></button>
          <button type="button" class="ib" id="tl-next" title="Next era (Right arrow)" aria-label="Next era"><svg viewBox="0 0 16 16"><path d="M12 3.5v9" /><path d="M4 3.8L10 8l-6 4.2z" class="f"/></svg></button>
        </div>
        <button type="button" class="seg-btn" id="tl-present" title="Show only present-day borders (P)" aria-pressed="false">Present day only</button>
      </div>
      <div class="tl-track" id="tl-track" tabindex="0" role="slider" aria-label="Historical era" aria-valuemin="0"></div>
    </div>
    <button class="dock-toggle" type="button" id="dock-toggle" aria-expanded="true" aria-controls="tl-readout">Details</button>
  </section>

  <!-- Era readout (right, full height) -->
  <aside class="side" id="tl-readout" aria-label="Era details">
    <!-- Region history (shown while a region is selected; filled by js/regions.js) -->
    <div class="rg-view" id="rg-view" hidden></div>

    <div class="er-view" id="er-view">
      <h2 class="er-name" id="er-name">—</h2>
      <div class="er-years" id="er-years">—</div>
      <div class="er-cols">
        <div class="er-main">
          <p class="er-summary" id="er-summary"></p>
          <p class="er-tip">Click any region on the map to read its history in this era.</p>
          <h3 class="side-title">On the map</h3>
          <ul class="er-ovs" id="er-ovs" aria-label="Areas shown on the map"></ul>
        </div>
        <div class="er-aside">
          <h3 class="side-title">Key events</h3>
          <ol class="er-events" id="er-events" aria-label="Key events"></ol>
        </div>
      </div>
      <p class="er-note" id="er-note"></p>
    </div>
  </aside>
</div>
