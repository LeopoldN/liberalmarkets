name: Update market closes

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"   # every day, after the US close (crypto trades on weekends)
    - cron: "0 15 * * 1-5"  # weekdays, picks up FRED's overnight releases and late Asian closes

permissions:
  contents: write

concurrency:
  group: market-closes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch closes and rebuild markets.json + tape.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch-markets.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/markets data/markets.json tape.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/markets data/markets.json tape.json
          git commit -m "chore: update market closes"
          git pull --rebase
          git push
