<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Every article published on Liberal Markets, newest first, with search and topic filters.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff1e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <title>All articles · Liberal Markets</title>
  <link rel="icon" type="image/svg+xml" href="assets/liberalmarketslogo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
  <script>
    // Apply saved preferences before first paint so nothing flashes.
    (function () {
      var d = document.documentElement;
      try {
        var theme = localStorage.getItem("lm-theme");
        if (theme === "light" || theme === "dark") d.dataset.theme = theme;
        if (localStorage.getItem("lm-fish") === "off") d.dataset.fish = "off";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/home/home.css">
  <script type="module" src="assets/home/home.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="bar__inner">
      <a class="wordmark" href="index.html">Liberal Markets</a>
      <nav class="nav" aria-label="Sections">
        <a href="articles.html" aria-current="page">Articles</a>
        <a href="trumptracker.html">Trump Tracker</a>
        <a href="markets.html">Markets</a>
        <a href="games.html">Games</a>
        <a href="fishbowl.html">Fish Bowl</a>
      </nav>
      <div class="controls">
        <button class="control" type="button" data-search-open aria-haspopup="dialog">Search <kbd>/</kbd></button>
        <button class="control" type="button" data-theme-toggle>Night</button>
        <button class="control control--fish" type="button" data-fish-toggle aria-pressed="true">Fish</button>
      </div>
    </div>
    <div class="ticker" role="region" aria-label="Latest headlines">
      <span class="ticker__label">Latest</span>
      <div class="ticker__viewport">
        <div class="ticker__track" data-wire></div>
      </div>
    </div>
  </header>

  <div class="tank tank--left" aria-hidden="true"><canvas></canvas></div>
  <div class="tank tank--right" aria-hidden="true"><canvas></canvas></div>

  <main id="main" class="page page--archive">
    <header class="archive-head">
      <h1>All articles</h1>
      <p>Everything published on Liberal Markets, newest first.</p>
    </header>

    <section class="block" aria-label="Articles">
      <div class="finder">
        <label class="finder__field" for="archive-search">
          <span class="visually-hidden">Search articles</span>
          <input id="archive-search" type="search" placeholder="Search by title, topic or ticker" autocomplete="off" spellcheck="false" data-archive-search>
        </label>
        <span class="finder__status" role="status" data-archive-count></span>
      </div>
      <div class="filters" role="group" aria-label="Filter by topic" data-archive-topics></div>
      <ol class="archive" data-archive></ol>
    </section>
  </main>

  <footer class="foot">
    <div class="foot__inner">
      <span class="wordmark wordmark--small">Liberal Markets</span>
      <p>Headlines from CNBC. Economic data from FRED. The aquarium is adapted from <a href="https://github.com/stackedlol/ascii-sharks">ascii-sharks</a> (MIT).</p>
    </div>
  </footer>

  <div class="search" data-search hidden>
    <div class="search__scrim" data-search-close></div>
    <div class="search__panel" role="dialog" aria-modal="true" aria-label="Search Liberal Markets">
      <label class="search__field">
        <span class="visually-hidden">Search</span>
        <input id="site-search" type="search" placeholder="Search stories, tools, games, indicators" autocomplete="off" spellcheck="false" aria-controls="search-results" data-search-input>
        <kbd>esc</kbd>
      </label>
      <ul class="search__results" id="search-results" role="listbox" data-search-results></ul>
    </div>
  </div>
</body>
</html>
