<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liberal Markets is currently under construction.">
  <meta name="robots" content="noindex, follow">
  <title>Liberal Markets</title>
  <link rel="icon" type="image/svg+xml" href="assets/liberalmarketslogo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&amp;family=Newsreader:opsz,wght@6..72,600;6..72,700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: #171717;
      background: #f7f5f0;
      font-family: "Libre Franklin", sans-serif;
    }

    header,
    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid #d8d5ce;
    }

    .brand {
      color: inherit;
      font-family: "Newsreader", serif;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
    }

    .status {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    main {
      padding: clamp(90px, 18vh, 170px) 0 80px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #666;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0 0 24px;
      font-family: "Newsreader", serif;
      font-size: clamp(48px, 8vw, 76px);
      line-height: .98;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 560px;
      margin: 0 0 32px;
      color: #555;
      font-size: 18px;
      line-height: 1.6;
    }

    .games-link {
      display: inline-block;
      padding: 14px 20px;
      color: #fff;
      background: #171717;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .games-link:hover {
      background: #3f3f3f;
    }

    .games-link:focus-visible {
      outline: 3px solid #39718a;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Liberal Markets</a>
    <span class="status">Under construction</span>
  </header>

  <main>
    <p class="eyebrow">We’ll be back soon</p>
    <h1>The site is under construction.</h1>
    <p class="intro">We’re working on a new version of Liberal Markets. In the meantime, our daily trade games are still open.</p>
    <a class="games-link" href="games.html">Play the games&nbsp; →</a>
  </main>
</body>
</html>
